name: Compilar projetos PlatformIO

on:
  push:
    paths:
      - "projetos/**"
      - ".github/workflows/platformio.yml"
  pull_request:
    paths:
      - "projetos/**"
      - ".github/workflows/platformio.yml"

jobs:
  esp32-wokwi-teste:
    name: ESP32 Wokwi Teste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/esp32-wokwi-teste
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compilar firmware ESP32
        run: pio run
